name: 네이버 빈 대표이미지 실제 DOM 진단

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fix-image-override-merge

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 현재 병합 데이터 공란 집계
        run: |
          python - <<'PY'
          from scripts.update_restaurants import DEFAULT_BASE_CSV, DEFAULT_ADMIN_DATA, DEFAULT_OUTPUT, load_targets, place_id_from_url
          targets, _ = load_targets(DEFAULT_BASE_CSV, DEFAULT_ADMIN_DATA, DEFAULT_OUTPUT)
          blanks = [r for r in targets.values() if not str(r.get("imageUrl", "")).strip()]
          short = [r for r in blanks if str(r.get("naverPlaceUrl", "")).strip().rstrip('/').endswith('/' + place_id_from_url(r.get("naverPlaceUrl")))]
          print(f"현재 공개 병합 대상: {len(targets)}")
          print(f"대표이미지 공란: {len(blanks)}")
          print(f"공란 중 짧은 Place URL: {len(short)}")
          for r in blanks[:10]:
              print("BLANK", r.get("targetKey"), r.get("name"), r.get("naverPlaceUrl"))
          PY

      - name: Playwright 설치
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium

      - name: 국제한우돈 등 실제 렌더링 DOM 이미지 진단
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from scripts.refresh_naver_images import fetch_place_media

          samples = [
              ("38370279", "국제한우돈"),
              ("1796542659", "우도옥 삼성본점"),
              ("1446760348", "명품순두부24시"),
              ("1682608465", "장어명가풍천민물장어직판장"),
          ]

          for place_id, name in samples:
              try:
                  detail = fetch_place_media(place_id)
                  print(f"APOLLO {place_id} {name} title={detail.get('title')} images={len(detail.get('imageUrls') or [])}")
                  for u in (detail.get('imageUrls') or [])[:5]:
                      print("  APOLLO_IMG", u)
              except Exception as exc:
                  print(f"APOLLO_FAIL {place_id} {name}: {exc}")

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(locale="ko-KR", user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36")
              page = context.new_page()
              for place_id, name in samples:
                  url = f"https://pcmap.place.naver.com/restaurant/{place_id}/home"
                  try:
                      page.goto(url, wait_until="domcontentloaded", timeout=60000)
                      page.wait_for_timeout(5000)
                      imgs = page.locator("img").evaluate_all("""els => els.map((e,i) => ({i, src:e.getAttribute('src')||'', dataSrc:e.getAttribute('data-src')||'', alt:e.getAttribute('alt')||'', cls:e.className||'', parent:(e.parentElement&&e.parentElement.className)||''}))""")
                      useful = [x for x in imgs if ('pstatic.net' in (x['src'] or '') or 'pstatic.net' in (x['dataSrc'] or '') or 'naver.net' in (x['src'] or '') or 'naver.net' in (x['dataSrc'] or ''))]
                      print(f"DOM {place_id} {name} total_img={len(imgs)} useful={len(useful)} title={page.title()}")
                      for x in useful[:20]:
                          print("  DOM_IMG", x)
                  except Exception as exc:
                      print(f"DOM_FAIL {place_id} {name}: {exc}")
              browser.close()
          PY
