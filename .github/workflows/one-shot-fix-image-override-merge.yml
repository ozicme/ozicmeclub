name: 네이버 빈 대표이미지 DOM 기준 복구

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fix-image-override-merge
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Playwright 설치
        run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium

      - name: 현재 공란 식당의 실제 네이버 DOM 대표이미지 복구
        run: |
          python - <<'PY'
          import asyncio
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlsplit

          from playwright.async_api import async_playwright
          from scripts.refresh_naver_images import fetch_place_media, is_static_image_url, names_compatible
          from scripts.update_restaurants import (
              DEFAULT_BASE_CSV,
              DEFAULT_ADMIN_DATA,
              DEFAULT_OUTPUT,
              load_targets,
              place_id_from_url,
          )

          targets, _ = load_targets(DEFAULT_BASE_CSV, DEFAULT_ADMIN_DATA, DEFAULT_OUTPUT)
          blanks = [
              r for r in targets.values()
              if not str(r.get("imageUrl", "")).strip() and place_id_from_url(r.get("naverPlaceUrl"))
          ]
          print(f"복구 대상(공란+Place ID): {len(blanks)}")

          def allowed_host(url):
              try:
                  host = (urlsplit(url).hostname or "").lower()
              except ValueError:
                  return False
              return host.endswith("pstatic.net") or host.endswith("naver.net")

          async def main():
              updates = []
              failures = []
              semaphore = asyncio.Semaphore(6)
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context(
                      locale="ko-KR",
                      user_agent=(
                          "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                          "AppleWebKit/537.36 Chrome/131.0 Safari/537.36"
                      ),
                  )

                  async def repair(record):
                      async with semaphore:
                          place_id = place_id_from_url(record.get("naverPlaceUrl"))
                          name = str(record.get("name", "")).strip()
                          key = str(record.get("targetKey", "")).strip()

                          try:
                              detail = await asyncio.to_thread(fetch_place_media, place_id)
                              if not names_compatible(name, detail.get("title")):
                                  failures.append((key, name, "상호 불일치"))
                                  return
                          except Exception as exc:
                              failures.append((key, name, f"상호 확인 실패: {exc}"))
                              return

                          page = await context.new_page()
                          try:
                              await page.goto(
                                  f"https://pcmap.place.naver.com/restaurant/{place_id}/home",
                                  wait_until="domcontentloaded",
                                  timeout=60000,
                              )
                              try:
                                  await page.wait_for_selector(".place_thumb img", state="attached", timeout=15000)
                              except Exception:
                                  pass
                              await page.wait_for_timeout(1200)

                              locators = page.locator(".place_thumb img")
                              count = await locators.count()
                              selected = ""
                              for index in range(count):
                                  image = locators.nth(index)
                                  parent_class = await image.evaluate(
                                      "e => (e.closest('.place_thumb') && e.closest('.place_thumb').className) || ''"
                                  )
                                  if "place_type_video" in str(parent_class):
                                      continue
                                  src = (await image.get_attribute("src")) or (await image.get_attribute("data-src")) or ""
                                  src = src.strip()
                                  if not src or not allowed_host(src) or not is_static_image_url(src):
                                      continue
                                  if not await image.is_visible():
                                      continue
                                  selected = src
                                  break

                              if selected:
                                  updates.append((key, name, place_id, selected))
                                  print("RECOVERED", key, name, selected)
                              else:
                                  failures.append((key, name, "보이는 정지 place_thumb 이미지를 찾지 못함"))
                                  print("NO_IMAGE", key, name)
                          except Exception as exc:
                              failures.append((key, name, f"DOM 확인 실패: {exc}"))
                              print("FAILED", key, name, exc)
                          finally:
                              await page.close()

                  await asyncio.gather(*(repair(record) for record in blanks))
                  await context.close()
                  await browser.close()
              return updates, failures

          updates, failures = asyncio.run(main())

          existing = json.loads(DEFAULT_OUTPUT.read_text(encoding="utf-8"))
          by_key = {
              str(item.get("targetKey", "")).strip(): item
              for item in existing
              if isinstance(item, dict) and str(item.get("targetKey", "")).strip()
          }
          today = datetime.now(timezone.utc).date().isoformat()
          for key, name, place_id, image_url in updates:
              item = by_key.get(key)
              if item is None:
                  item = {"targetKey": key}
                  existing.append(item)
                  by_key[key] = item
              item["imageUrl"] = image_url
              item["updatedAt"] = today
              item["updateSource"] = "github-naver-dom-image-repair"

          DEFAULT_OUTPUT.write_text(
              json.dumps(existing, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          repaired_targets, _ = load_targets(DEFAULT_BASE_CSV, DEFAULT_ADMIN_DATA, DEFAULT_OUTPUT)
          remaining = [
              r for r in repaired_targets.values()
              if not str(r.get("imageUrl", "")).strip()
          ]
          print(f"복구 성공: {len(updates)}")
          print(f"복구 실패/사진 없음: {len(failures)}")
          print(f"전체 대표이미지 공란 잔여: {len(remaining)}")
          for row in failures:
              print("UNRESOLVED", *row)
          PY

      - name: 기존 Apollo 수집 실패 시 이미지를 지우지 않도록 안전장치 수정
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/refresh_naver_images.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "6. When Naver is readable but no static image is found, clear only a currently\n   non-static (GIF/video) image. Otherwise preserve the existing image.",
              "6. When the initial Naver payload has no static image, preserve the existing\n   image because visible Place media can be injected only after browser rendering.",
              1,
          )
          old = '''        elif current and not is_static_image_url(current):\n            # We can confidently enforce the rule on an already non-static\n            # stored URL without deleting a healthy static photo.\n            updates.append(\n                {\n                    "targetKey": str(record["targetKey"]),\n                    "imageUrl": "",\n                    "placeId": place_id,\n                }\n            )\n            stats["cleared_non_static"] += 1\n            stats["changed"] += 1\n        else:\n            stats["no_static_found_preserved"] += 1'''
          new = '''        else:\n            # The first HTML/Apollo payload does not always contain the media\n            # visible after the Naver Place page renders. Never clear a stored\n            # image solely because this lightweight fetch found no static media.\n            stats["no_static_found_preserved"] += 1'''
          if old not in text:
              raise SystemExit("예상한 기존 이미지 삭제 분기를 찾지 못했습니다.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: 검증
        run: |
          python -m py_compile scripts/refresh_naver_images.py
          python -m unittest scripts/test_refresh_naver_images.py
          npm run test-admin
          git diff --check

      - name: 일회성 워크플로 제거 후 수정 커밋
        run: |
          rm .github/workflows/one-shot-fix-image-override-merge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/restaurant-overrides.json scripts/refresh_naver_images.py .github/workflows/one-shot-fix-image-override-merge.yml
          git commit -m "네이버 DOM 기준 빈 대표이미지 복구"
          git push origin HEAD:agent/fix-image-override-merge
